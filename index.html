<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>健康飲食金字塔｜飲食問卷</title><style>body{font-family:Arial,'Noto Sans TC',sans-serif;background:#f3f6f3;margin:0;color:#24332b}main{max-width:1050px;margin:auto;padding:18px}h1{color:#b72e29}fieldset{border:1px solid #cbd8c8;border-radius:12px;background:white;margin:15px 0;padding:16px}legend{font-weight:bold;color:#29753d}label{display:block;margin:8px 0}input,select,textarea{box-sizing:border-box;width:100%;padding:9px;border:1px solid #b9c5ba;border-radius:6px;font-size:16px}textarea{min-height:60px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:10px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}button{background:#287944;color:white;border:0;padding:12px 20px;border-radius:7px;font-size:16px;cursor:pointer}button.secondary{background:#46647a}#preview{width:100%;background:white;border:1px solid #ddd}small{color:#53645a}.note{background:#fff6dc;padding:10px;border-radius:7px} </style></head><body><main><h1>健康飲食金字塔｜一週飲食問卷</h1><p>請填寫過去一週每天最常吃的食物，完成後可產生並下載橫式 JPG 飲食評估表。</p><fieldset><legend>一、受訪者資料</legend><div class="grid"><label>姓名<input id="name" placeholder="姓名"></label><label>性別<select id="sex"><option>男</option><option>女</option></select></label><label>年齡<input id="age" type="number" value="42"></label><label>身高（公分）<input id="height" type="number" value="168"></label><label>體重（公斤）<input id="weight" type="number" value="70"></label><label>每日喝水量（cc）<input id="water" type="number" value="2200"></label></div><label>慢性用藥（選填）<input id="med" placeholder="例如：血壓藥；無則留白"></label><label>目前不適（選填）<input id="symptom" placeholder="例如：容易疲倦；無則留白"></label></fieldset><fieldset><legend>二、一週內每天最常吃的飲食</legend><div class="grid"><label>早餐<textarea id="breakfast">鮭魚、美式咖啡</textarea></label><label>午餐<textarea id="lunch">白飯1碗、雞肉、蛋1顆、青菜0.5碗</textarea></label><label>晚餐<textarea id="dinner">滷雞腿、豆腐、炒青菜、水果</textarea></label><label>下午茶／宵夜<textarea id="snack">餅乾</textarea></label></div><label>每日水果（份；1份約一個拳頭大小）<input id="fruit" type="number" min="0" step="0.5" value="1"></label></fieldset><fieldset><legend>三、每日實際攝取量（可手動修正估算值）</legend><p><small>按「依飲食文字粗估」會從上方文字辨識常見食物；辨識不完整時請手動修正。份數是示意換算，不是精密營養分析。</small></p><button class="secondary" onclick="estimate()">依飲食文字粗估</button><div class="grid"><label>油脂類（份）<input id="fat" type="number" min="0" step="0.5" value="6.5"></label><label>蛋白質類（份）<input id="protein" type="number" min="0" step="0.5" value="12.5"></label><label>蔬果類（份）<input id="produce" type="number" min="0" step="0.5" value="3"></label><label>全穀雜糧類（碗）<input id="grain" type="number" min="0" step="0.1" value="1.3"></label></div><p class="note">蔬果建議量：依性別與年齡採用簡化的「蔬果579」規則，未滿12歲5份、成年女性7份、成年男性9份。實際需求應依個別健康狀況調整。</p></fieldset><fieldset><legend>四、問卷人與營養補充建議</legend><div class="grid"><label>問卷人姓名<input id="interviewer" placeholder="問卷人"></label><label>聯絡電話<input id="phone" placeholder="電話"></label></div><label>紐崔萊建議（最多5項，每行一項，可自行修改）<textarea id="supplements">紐崔萊優質蛋白素：視每日蛋白質不足量補充
紐崔萊蔬果營養補充品：不能取代蔬菜水果
紐崔萊綜合維生素礦物質：視飲食缺口評估</textarea></label><label>每餐會員價（元；自行輸入實際價格）<input id="mealPrice" type="number" min="0" step="1" placeholder="未填則不顯示"></label></fieldset><div class="actions"><button onclick="render()">產生飲食評估圖</button><button class="secondary" onclick="downloadJpg()">下載 JPG 圖片</button></div><canvas id="preview" width="1500" height="1120"></canvas><p><small>注意：飲食評估為教育性估算，不能單憑飲食紀錄推定疾病；有慢性病、用藥或不適時，應由醫師／營養師確認補充品適用性。</small></p></main><script>
const $=id=>document.getElementById(id), v=id=>$(id).value, num=id=>Math.max(0,Number(v(id))||0),canvas=$('preview'),ctx=canvas.getContext('2d');
function estimate(){
  let s=[v('breakfast'),v('lunch'),v('dinner'),v('snack')].join('、');
  const count=re=>[...s.matchAll(re)].length;
  // 完整餐點優先換算，避免「雞腿便當」只辨識到雞腿，或重複計入飯菜。
  const bentos=count(/雞腿便當/g);
  const other=s.replace(/雞腿便當/g,'');
  const otherCount=re=>[...other.matchAll(re)].length;
  const fruit=num('fruit');
  $('protein').value=(bentos*3+otherCount(/雞肉|雞腿|魚|鮭魚|豆腐|豆干|牛肉|豬肉|蛋|蝦|海鮮|豆漿/g)*2).toFixed(1);
  $('grain').value=(bentos*1+otherCount(/飯|麵|吐司|麵包|燕麥|饅頭|地瓜|水餃/g)*0.8+otherCount(/餅乾/g)*0.2).toFixed(1);
  $('produce').value=(fruit+bentos*1+otherCount(/青菜|蔬菜|高麗菜|花椰菜|菠菜|沙拉|番茄|水果/g)).toFixed(1);
  $('fat').value=(bentos*3+otherCount(/炒|炸|煎|油|堅果|餅乾|雞腿|鮭魚/g)*1.5).toFixed(1);
  render();
}
function text(t,x,y,size=24,color='#222',bold=false){ctx.fillStyle=color;ctx.font=`${bold?'bold ':''}${size}px Arial, 'Noto Sans TC', sans-serif`;ctx.fillText(String(t),x,y)}
function lines(t,x,y,maxWidth=390,size=22,step=31,maxLines=4){ctx.font=`${size}px Arial, sans-serif`;let out=[],line='';for(let ch of String(t)){if(ctx.measureText(line+ch).width>maxWidth){out.push(line);line=ch}else line+=ch}if(line)out.push(line);out.slice(0,maxLines).forEach((a,i)=>text(a,x,y+i*step,size));return Math.min(out.length,maxLines)*step}
function rule(x,y,w){ctx.strokeStyle='#aaa';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y);ctx.stroke()}
function polygon(points,color){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=color;ctx.fill()}
function fmt(n){return Math.round(n*10)/10}
function render(){let c=ctx;c.fillStyle='white';c.fillRect(0,0,1500,1120);let weight=num('weight'),age=num('age'),male=v('sex')==='男',pg=age<12?5:(male?9:7),goals=[4,Math.max(1,fmt(weight/7)),pg,3],actual=[num('fat'),num('protein'),num('produce'),num('grain')],colors=['#ffe477','#f49cc1','#9dd78d','#ffc879'];text('健康飲食金字塔',45,75,44,'#bd302b',true);rule(45,94,325);text(v('name')||'受訪者',490,65,36,'#222',true);text(`${age}歲　${v('sex')}　${num('height')}公分　${weight}公斤`,490,111,25);text(`評估日期 ${new Date().toLocaleDateString('zh-TW')}`,750,68,20,'#555');text('【你一天的飲食】',1125,88,28,'#26783a',true);
const labels=['油脂類','蛋白質、豆魚蛋肉類','蔬果類','全穀雜糧類'],ys=[170,277,403,540],notes=[`建議 ${goals[0]} 份　吃了 ${actual[0]} 份`,`建議 ${goals[1]} 份　吃了 ${actual[1]} 份`,`建議 ${pg} 份　吃了 ${actual[2]} 份`,`建議 ${goals[3]} 碗　吃了 ${actual[3]} 碗`];labels.forEach((a,i)=>{text(a,48,ys[i],25,'#bf302b',true);text(notes[i],48,ys[i]+37,21);if((i===1||i===2)&&actual[i]<goals[i])text(`-${fmt(goals[i]-actual[i])} 份`,48,ys[i]+67,21,'#b36b15',true)});
// Pyramid segments: top narrow, base wide; overages extend to the right.
let bounds=[{y0:165,y1:258},{y0:258,y1:366},{y0:366,y1:486},{y0:486,y1:605}],left=y=>590-(y-165)*.43,right=y=>590+(y-165)*.44;
bounds.forEach((b,i)=>{let x0=left(b.y0),x1=left(b.y1),r0=right(b.y0),r1=right(b.y1),fraction=Math.min(1,actual[i]/goals[i]);c.save();c.beginPath();c.moveTo(x0,b.y0);c.lineTo(r0,b.y0);c.lineTo(r1,b.y1);c.lineTo(x1,b.y1);c.closePath();c.clip();let maxR=Math.max(r0,r1),xEnd=x1+(maxR-x1)*fraction;c.fillStyle=colors[i];c.fillRect(x1,b.y0-1,Math.max(0,xEnd-x1),b.y1-b.y0+2);c.restore();c.strokeStyle='#222';c.lineWidth=2;c.beginPath();c.moveTo(x0,b.y0);c.lineTo(r0,b.y0);c.lineTo(r1,b.y1);c.lineTo(x1,b.y1);c.closePath();c.stroke();if(actual[i]>goals[i]){let extra=actual[i]-goals[i],width=Math.min(150,extra/goals[i]*115);polygon([[r0,b.y0],[r0+width,b.y0],[r1+width,b.y1],[r1,b.y1]],colors[i]);c.strokeStyle='#3465bb';c.lineWidth=4;c.beginPath();c.moveTo(r0+width,b.y0);c.lineTo(r1+width,b.y1);c.stroke();text(`+${fmt(extra)}`,r1+width+12,(b.y0+b.y1)/2,22,'#ba3c39',true)}else if(actual[i]<goals[i]&&(i===1||i===2)){text(`-${fmt(goals[i]-actual[i])}`,right(b.y1)+15,(b.y0+b.y1)/2,22,'#b36b15',true)}});
let waterGoal=Math.round(weight*35),water=num('water'),wx=405,wy=646,ww=450;c.strokeStyle='#222';c.lineWidth=3;c.strokeRect(wx,wy,ww,42);c.fillStyle='#91d2f5';c.fillRect(wx+2,wy+2,(ww-4)*Math.min(1,water/Math.max(1,waterGoal)),38);text(`水分建議：${waterGoal} cc／日`,405,725,25,'#bb332b',true);text(`實際 ${water} cc　差額 ${water-waterGoal>=0?'+':''}${water-waterGoal} cc`,405,765,23);
let food=[['早',v('breakfast')],['中',v('lunch')],['晚',v('dinner')],['茶／宵夜',v('snack')]];food.forEach(([a,b],i)=>{let y=145+i*105;text(a+'：',1025,y,23);lines(b,1105,y,345,21,29,3);rule(1025,y+75,420)});text('【統計】',1180,600,28,'#26783a',true);c.fillStyle='#d3e4b5';c.fillRect(1025,618,425,55);text('類別',1065,655,23);text('實際攝取',1285,655,23);labels.forEach((a,i)=>{let y=700+i*57;text(a.length>9?a.slice(0,9):a,1035,y,20);text(`${actual[i]} ${i===3?'碗':'份'}`,1300,y,21);rule(1025,y+15,425)});
let bmi=num('height')?fmt(weight/(num('height')/100)**2):0;text(`BMI ${bmi}（僅供參考）`,48,840,20,'#555');text('【營養補充建議】',48,885,25,'#26783a',true);let supp=v('supplements').split('\n').filter(Boolean).slice(0,5);supp.forEach((s,i)=>lines(`${i+1}. ${s}`,48,918+i*36,900,19,25,1));let price=v('mealPrice');if(price)text(`會員價：每餐約 NT$ ${num('mealPrice')}（自行填報）`,48,1090,19);c.fillStyle='#e3edf9';c.fillRect(1025,925,425,115);text(`問卷人：${v('interviewer')||'未填寫'}`,1040,965,23);text(`電話：${v('phone')||'未填寫'}`,1040,1005,23);text('飲食估算不等於醫療診斷；補充品請確認與用藥交互作用。',48,1055,17,'#666');return canvas}
// 從網址參數自動帶入問卷人資料；不改動其他問卷或繪圖功能。
function loadInterviewerFromUrl(){
  const params=new URLSearchParams(window.location.search);
  const interviewer=params.get('interviewer');
  const phone=params.get('phone');
  if(interviewer!==null) $('interviewer').value=interviewer;
  if(phone!==null) $('phone').value=phone;
}
loadInterviewerFromUrl();
function downloadJpg(){render();let a=document.createElement('a');a.download=`健康飲食金字塔_${v('name')||'受訪者'}.jpg`;a.href=canvas.toDataURL('image/jpeg',0.95);document.body.appendChild(a);a.click();a.remove()}render();
</script></body></html>
