<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>一週飲食問卷與評估</title>
<style>
:root{--green:#24784b;--light:#edf7ef}*{box-sizing:border-box}body{margin:0;background:#f5f7f5;font-family:"Noto Sans TC",Arial,sans-serif;color:#26352b}main{max-width:950px;margin:auto;padding:18px}h1{color:var(--green);font-size:26px}.card{background:white;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 2px 12px #0001}h2{font-size:19px;color:var(--green)}label{display:block;margin:10px 0 5px;font-weight:600}input,select,textarea{width:100%;padding:11px;border:1px solid #bdcfc0;border-radius:8px;font:inherit}textarea{min-height:62px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}button{border:0;background:var(--green);color:white;padding:13px 18px;border-radius:8px;font-size:16px;cursor:pointer;margin:5px 5px 5px 0}.secondary{background:#596b5e}.note{color:#647168;font-size:13px;line-height:1.6}#preview{max-width:100%;border:1px solid #ddd;display:none}table{border-collapse:collapse;width:100%}td,th{border:1px solid #9aaea0;padding:7px;text-align:center}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body><main>
<h1>一週內每天最常飲食記錄</h1>
<p class="note">填寫過去一週最常見的每日飲食，產生飲食評估 JPG 圖及僅供問卷人查看的健康提醒。</p>
<section class="card"><h2>基本資料</h2><div class="grid">
<div><label>受訪者姓名</label><input id="name" placeholder="姓名"></div>
<div><label>性別</label><select id="sex"><option value="女">女</option><option value="男">男</option></select></div>
<div><label>體重（公斤）</label><input id="weight" type="number" min="1" placeholder="例如 60"></div>
<div><label>每日喝水（毫升）</label><input id="water" type="number" min="0" placeholder="例如 1500"></div>
<div><label>問卷人姓名</label><input id="interviewer" placeholder="問卷人"></div>
<div><label>問卷人電話</label><input id="phone" type="tel" placeholder="電話"></div>
</div></section>
<section class="card"><h2>每日最常飲食內容</h2>
<label>早餐</label><textarea id="breakfast" placeholder="例如：吐司2片、蛋1顆、豆漿1杯"></textarea>
<label>午餐</label><textarea id="lunch" placeholder="例如：白飯1碗、雞肉1掌心、青菜半碗"></textarea>
<label>晚餐</label><textarea id="dinner"></textarea>
<label>下午茶／宵夜</label><textarea id="snack"></textarea>
<div class="grid"><div><label>水果（每日份數）</label><input id="fruit" type="number" min="0" step=".5" placeholder="例如 1"></div>
<div><label>蔬菜（每日份數）</label><input id="veg" type="number" min="0" step=".5" placeholder="例如 2"></div>
<div><label>蛋白質食物（每日份數）</label><input id="protein" type="number" min="0" step=".5" placeholder="例如 3"></div>
<div><label>全穀雜糧（每日份數，可選）</label><input id="grain" type="number" min="0" step=".5"></div></div>
<p class="note">份數請依實際食物估算：蔬菜煮熟約半碗為1份；水果約一個拳頭為1份；蛋白質約1顆蛋、半盒嫩豆腐或1兩肉為1份。未填寫的份數不會由文字自動精準辨識。</p></section>
<section class="card"><h2>健康相關（僅供問卷人查看）</h2>
<label>目前使用的慢性病藥物</label><textarea id="meds" placeholder="可不填；例如血壓藥"></textarea>
<label>目前不適或健康狀況</label><textarea id="symptoms" placeholder="可不填"></textarea>
<p class="note">本頁資料在瀏覽器本機處理，不會自動傳送到伺服器。請先取得受訪者同意再記錄健康資訊。</p></section>
<section class="card"><h2>產生評估</h2><button id="make">產生飲食評估圖</button><button id="save" class="secondary">下載 JPG</button><button id="private" class="secondary">下載問卷人專用文字</button>
<p id="status" class="note"></p><img id="preview" alt="飲食評估表預覽"></section>
</main>
<script>
const $=id=>document.getElementById(id), val=id=>$(id).value.trim(),num=id=>{let v=parseFloat(val(id));return Number.isFinite(v)?v:null};
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 只接受固定允許的網址參數；可分享問卷人姓名與電話，勿在網址放入受訪者健康資料。
const qs=new URLSearchParams(location.search);
if(qs.has('interviewer'))$('interviewer').value=qs.get('interviewer').slice(0,80);
if(qs.has('phone'))$('phone').value=qs.get('phone').slice(0,40);
function wrap(ctx,s,x,y,max,line=25){let words=Array.from(String(s||'未填寫'));let row='',yy=y;for(let ch of words){if(ctx.measureText(row+ch).width>max){ctx.fillText(row,x,yy);row=ch;yy+=line}else row+=ch}ctx.fillText(row,x,yy);return yy+line}
function report(){
let sex=val('sex'), fruit=num('fruit'),veg=num('veg'),protein=num('protein'),grain=num('grain');
let targets={fruit:sex==='男'?2:2,veg:sex==='男'?4:3,protein:sex==='男'?6:5,grain:sex==='男'?3:3};
let rows=[['蔬菜',veg,targets.veg],['水果',fruit,targets.fruit],['蛋白質',protein,targets.protein],['全穀雜糧',grain,targets.grain]];
let shortages=rows.slice(0,3).filter(r=>r[1]!==null&&r[1]<r[2]).map(r=>r[0]+' -'+(r[2]-r[1]).toFixed(1).replace('.0','')+'份');
return {rows,shortages,targets};
}
function render(){
let d=report(),c=document.createElement('canvas');c.width=1400;c.height=1100;let ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,1400,1100);
ctx.fillStyle='#206d44';ctx.fillRect(0,0,1400,85);ctx.fillStyle='white';ctx.font='bold 38px sans-serif';ctx.fillText('每日飲食評估表',55,57);
ctx.fillStyle='#26352b';ctx.font='23px sans-serif';ctx.fillText('受訪者：'+(val('name')||'未填'),55,132);ctx.fillText('性別：'+val('sex')+'    體重：'+(val('weight')||'—')+' kg',55,170);
ctx.fillText('日期：'+new Date().toLocaleDateString('zh-TW'),55,208);
ctx.strokeStyle='#8cae95';ctx.lineWidth=2;ctx.strokeRect(35,235,800,755);ctx.strokeRect(850,235,515,350);ctx.strokeRect(850,600,515,390);
ctx.fillStyle='#206d44';ctx.font='bold 27px sans-serif';ctx.fillText('飲食均衡三角形',65,283);ctx.fillText('一週內每天最常飲食',875,279);ctx.fillText('營養份數評估',875,645);
let bands=[{y:330,w:160,color:'#f1c979',label:'油脂／堅果'},{y:450,w:310,color:'#f5dc91',label:'蛋白質'},{y:570,w:465,color:'#b2d9a0',label:'蔬菜／水果'},{y:690,w:620,color:'#d7b985',label:'全穀雜糧'}];
bands.forEach(b=>{let x=440-b.w/2;ctx.fillStyle=b.color;ctx.beginPath();ctx.moveTo(x,b.y+110);ctx.lineTo(x+ b.w,b.y+110);ctx.lineTo(440+(b.w-155)/2,b.y);ctx.lineTo(440-(b.w-155)/2,b.y);ctx.closePath();ctx.fill();ctx.fillStyle='#24382b';ctx.font='bold 25px sans-serif';ctx.textAlign='center';ctx.fillText(b.label,440,b.y+68)});ctx.textAlign='left';
ctx.fillStyle='#8b3030';ctx.font='bold 25px sans-serif';ctx.fillText('不足：'+(d.shortages.join('、')||'無可判定不足項目'),65,885);
ctx.fillStyle='#555';ctx.font='19px sans-serif';ctx.fillText('僅蛋白質、蔬菜、水果標示「-份」；未填者不判定。',65,931);
let yy=322;ctx.fillStyle='#26352b';ctx.font='21px sans-serif';
[['早餐','breakfast'],['午餐','lunch'],['晚餐','dinner'],['下午茶／宵夜','snack']].forEach(([title,id])=>{ctx.fillStyle='#206d44';ctx.font='bold 21px sans-serif';ctx.fillText(title+'：',875,yy);yy+=29;ctx.fillStyle='#26352b';ctx.font='19px sans-serif';yy=wrap(ctx,val(id)||'未填',875,yy,460,24)+13});
ctx.fillStyle='#26352b';ctx.font='20px sans-serif';ctx.fillText('種類',875,693);ctx.fillText('建議',1060,693);ctx.fillText('實際',1190,693);ctx.fillText('不足',1280,693);
d.rows.forEach((r,i)=>{let y=740+i*56;ctx.fillText(r[0],875,y);ctx.fillText(r[2]+'份',1060,y);ctx.fillText(r[1]===null?'未填':r[1]+'份',1190,y);ctx.fillText(i===3?'—':r[1]===null?'—':r[1]<r[2]?'-'+(r[2]-r[1]).toFixed(1).replace('.0',''):'—',1280,y)});
ctx.fillStyle='#26352b';ctx.font='20px sans-serif';ctx.fillText('飲水：'+(val('water')||'未填')+' mL／日',875,964);
ctx.fillStyle='#206d44';ctx.font='21px sans-serif';ctx.fillText('問卷人：'+(val('interviewer')||'未填')+'    電話：'+(val('phone')||'未填'),55,1040);
ctx.fillStyle='#777';ctx.font='16px sans-serif';ctx.fillText('參考值僅供初步衛教，應依年齡、活動量與個人健康狀況調整。',850,1038);
return c;
}
$('make').onclick=()=>{let c=render();$('preview').src=c.toDataURL('image/jpeg',.92);$('preview').style.display='block';$('status').textContent='評估圖已產生，可下載 JPG。'};
$('save').onclick=()=>{let a=document.createElement('a');a.href=render().toDataURL('image/jpeg',.94);a.download='飲食評估表_'+(val('name')||'受訪者')+'.jpg';a.click()};
$('private').onclick=()=>{
let d=report(),txt=['【問卷人專用：飲食健康提醒】','受訪者：'+(val('name')||'未填'),'藥物：'+(val('meds')||'未填'),'不適：'+(val('symptoms')||'未填'),'','初步不足：'+(d.shortages.join('、')||'無可判定項目'),'飲水量：'+(val('water')||'未填')+' mL/日','','長期飲食失衡可能造成：膳食纖維不足、蛋白質不足或營養攝取不均；是否發生無法單靠問卷判斷。','建議：優先增加天然蔬果與優質蛋白質，並視實際飲食調整。','','營養補充方向（最多5類；非處方）：','1. 紐崔萊優質蛋白：蛋白質攝取不足時評估。','2. 紐崔萊綜合維生素礦物質：飲食不均衡時評估。','3. 紐崔萊膳食纖維：蔬菜水果攝取不足時評估。','4. 紐崔萊魚油：魚類攝取不足時評估。','5. 紐崔萊鈣鎂：乳品與含鈣食物不足時評估。','','補充數量及會員價／每餐費用：因未提供確切產品規格、會員價格與適用劑量，不自動編造；請依產品標示與當期官方價格填寫。','服用慢性藥或有症狀者，先諮詢醫師／藥師，勿以營養品取代治療。'];
let blob=new Blob([txt.join('\n')],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='問卷人專用_'+(val('name')||'受訪者')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
};
</script></body></html>
